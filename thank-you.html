<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Uno Systems</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="img/fav.png" />

  <!-- Meta Pixel: paste the client's pixel snippet here, with fbq('track', 'Lead') after PageView -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root { --red: #cf0707; --red-dark: #a80505; --ink: #111113; --muted: #5f5f66; --grey: #f3f3f4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--grey);
      min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    }
    header { background: var(--ink); }
    header .wrap { height: 76px; display: flex; align-items: center; }
    header img { height: 44px; width: auto; }
    .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 20px; }
    main { flex: 1; display: grid; place-items: center; padding: 60px 20px; }
    .box { background: #fff; border-top: 5px solid var(--red); border-radius: 18px; padding: 48px 36px; max-width: 540px; text-align: center; box-shadow: 0 30px 60px -30px rgba(0,0,0,.3); }
    .check { width: 72px; height: 72px; border-radius: 50%; background: #fdeaea; color: var(--red); display: grid; place-items: center; margin: 0 auto 24px; }
    .check svg { width: 36px; height: 36px; }
    h1 { font-family: 'Archivo', sans-serif; font-weight: 900; letter-spacing: -.02em; font-size: clamp(32px, 5vw, 42px); line-height: 1.05; margin-bottom: 14px; }
    p { color: var(--muted); font-size: 17px; line-height: 1.6; margin-bottom: 28px; }
    .call { display: inline-flex; align-items: center; gap: 10px; background: var(--red); color: #fff; font-weight: 700; text-decoration: none; padding: 15px 26px; border-radius: 10px; }
    .call:hover { background: var(--red-dark); }
    .call svg { width: 18px; height: 18px; }
    .back { display: block; margin-top: 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="https://www.unosystems.co.za/"><img src="img/logo.png" alt="Uno Systems" width="600" height="173" /></a>
    </div>
  </header>

  <main>
    <div class="box">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>Got it. We'll be in touch.</h1>
      <p>Thanks for your request. One of our team will call you back shortly to confirm your door size and book your installation. Need help urgently? Call us now.</p>
      <a href="tel:0833024450" class="call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        083 302 4450
      </a>
      <a href="index.html" class="back">&larr; Back to the page</a>
    </div>
  </main>
</body>
</html>
